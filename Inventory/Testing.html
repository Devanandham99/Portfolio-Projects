<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory System Prototype</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:40px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:left;
}

th{
    background:#f5f5f5;
}

h1{
    margin-bottom:20px;
}
</style>

</head>
<body>

<h1>Inventory System</h1>

<table id="inventoryTable">
    <thead>
        <tr>
            <th>Mat ID</th>
            <th>Supplier</th>
            <th>Style</th>
            <th>Material</th>
            <th>T Length</th>
            <th>T Width</th>
            <th>T Thickness</th>
            <th>R Length</th>
            <th>R Width</th>
            <th>R Thickness</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl =
    'https://sodcjwjjoatmdxevhlxu.supabase.co';

const supabaseKey =
    'sb_publishable_1t6bZNG-7DnAzblZ1HJHig_I5j9ycFh';

const supabase = createClient(
    supabaseUrl,
    supabaseKey
);

async function loadInventory() {

    const { data, error } = await supabase
        .schema('Inventory System')
        .from('inventory_view')
        .select('*');

    if(error){
        console.error(error);
        alert(error.message);
        return;
    }

    const tbody =
        document.querySelector('#inventoryTable tbody');

    tbody.innerHTML = '';

    data.forEach(row => {

        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${row.mat_id}</td>
            <td>${row.supplier_name}</td>
            <td>${row.style_name}</td>
            <td>${row.material_name}</td>
            <td>${row["t_length(m)"]}</td>
            <td>${row["t_width(m)"]}</td>
            <td>${row["t_thickness(m)"]}</td>
            <td>${row["r_length(m)"]}</td>
            <td>${row["r_width(m)"]}</td>
            <td>${row["r_thickness(m)"]}</td>
        `;

        tbody.appendChild(tr);
    });
}

loadInventory();

</script>

</body>
</html>
