<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="topnav">

        <div class="nav-logo">
            <img src="images/Logo.png" alt="Erith Global">
        </div>

        <div class="nav-links">
            <a id="navInventory" href="Main_Inv_Page.html">Inventory</a>
            <a id="navSuppliers" href="Supplier_Page.html">Suppliers</a>
            <a id="navStyles" href="Style_Page.html">Product Styles</a>
            <a id="navPayments" href="Payment_Term.html">Payment Terms</a>
            <a id="navOrders" href="Order_List.html">Orders</a>
        </div>

        <div class="nav-user">

            <span id="usernameLabel"></span>

            <button class="btn btn-logout" onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <h1>Order List</h1>

    <div class="button-row">

        <button class="btn btn-primary" onclick="window.location.href='Order_Page.html'">

            + Create Order

        </button>

    </div>

    <div class="field-card" style="margin-bottom:20px;">

        <label>Search Orders</label>

        <input type="text" id="searchBox" placeholder="Search by Order ID or Reference">

    </div>

    <table class="inventory-table" id="ordersTable">

        <thead>

            <tr>

                <th>Order ID</th>
                <th>Reference</th>
                <th>Order Date</th>
                <th>Items</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>
    <script src="auth.js"></script>
    <script type="module">

        checkAccess(["inventory"]);

        import { createClient }
            from "ID1";

        const supabase = createClient(
            "ID2",
            "ID3"
        );

        const SCHEMA = "inventory_system";

        let allOrders = [];

        async function loadOrders() {

            const { data, error } =
                await supabase
                    .schema(SCHEMA)
                    .from("order_table")
                    .select(`
                        order_id,
                        reference,
                        order_date,
                        order_item (
                            item_id
                        )
                    `)
                    .order(
                        "order_id",
                        { ascending: false }
                    );

            if (error) {

                alert(error.message);

                return;

            }

            allOrders = data || [];

            renderOrders(allOrders);

        }

        function renderOrders(orderList) {

            const tbody =
                document.querySelector(
                    "#ordersTable tbody"
                );

            tbody.innerHTML = "";

            orderList.forEach(order => {

                const tr =
                    document.createElement("tr");

                tr.innerHTML = `

                    <td>

                        ${order.order_id}

                    </td>

                    <td>

                        ${order.reference ?? ""}

                    </td>

                    <td>

                        ${order.order_date ?? ""}

                    </td>

                    <td>

                        ${order.order_item?.length ?? 0}

                    </td>

                    <td>

                        <div class="action-buttons">

                            <button
                                class="btn btn-secondary"
                                onclick="window.location.href='Order_Page.html?order_id=${order.order_id}'">
                                View
                            </button>

                            <button
                                class="btn btn-danger"
                                onclick="deleteOrder(${order.order_id})">
                                Delete
                            </button>
                            
                        </div>

                    </td>

                `;

                tbody.appendChild(tr);

            });

        }

        document
            .getElementById("searchBox")
            .addEventListener("input", function () {

                const search =
                    this.value
                        .toLowerCase()
                        .trim();

                const filtered =
                    allOrders.filter(order =>

                        String(order.order_id)
                            .includes(search)

                        ||

                        (order.reference ?? "")
                            .toLowerCase()
                            .includes(search)

                    );

                renderOrders(filtered);

            });

        window.deleteOrder = async function (orderId) {

            if (!confirm(`Delete Order #${orderId}?`)) {
                return;
            }

            try {

                // Get order items
                const { data: items, error: itemFetchError } = await supabase
                    .schema(SCHEMA)
                    .from("order_item")
                    .select("*")
                    .eq("order_id", orderId);

                if (itemFetchError) {
                    alert(itemFetchError.message);
                    return;
                }

                // Restore inventory
                for (const item of items) {

                    const { data: inv, error: invError } = await supabase
                        .schema(SCHEMA)
                        .from("main_inv")
                        .select("available_quantity")
                        .eq("mat_id", item.mat_id)
                        .single();

                    if (invError) {
                        alert(invError.message);
                        return;
                    }

                    await supabase
                        .schema(SCHEMA)
                        .from("main_inv")
                        .update({
                            available_quantity:
                                inv.available_quantity + item.quantity
                        })
                        .eq("mat_id", item.mat_id);
                }

                // Delete order items
                await supabase
                    .schema(SCHEMA)
                    .from("order_item")
                    .delete()
                    .eq("order_id", orderId);

                // Delete order
                await supabase
                    .schema(SCHEMA)
                    .from("order_table")
                    .delete()
                    .eq("order_id", orderId);

                await loadOrders();

                alert("Order deleted successfully.");

            } catch (err) {

                console.error(err);
                alert(err.message);

            }
        };

        await loadOrders();

        const page = window.location.pathname.split("/").pop();

        const map = {
            "Main_Inv_Page.html": "navInventory",
            "Supplier_Page.html": "navSuppliers",
            "Style_Page.html": "navStyles",
            "Payment_Term.html": "navPayments",
            "Order_List.html": "navOrders",
            "Order_Page.html": "navOrders"
        };

        const activeId = map[page];

        if (activeId) {
            document.getElementById(activeId)?.classList.add("active");
        }

        showLoggedInUser();
    </script>

</body>

</html>
