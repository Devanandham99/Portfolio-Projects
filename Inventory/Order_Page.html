<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Details</title>

    <link rel="stylesheet" href="style.css">

    <!-- Tom Select CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">

    <!-- Tom Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
</head>

<body>
    <nav class="topnav">

        <div class="nav-logo">
            <img src="images/Logo.png" alt="Erith Global">
        </div>

        <div class="nav-links">
            <a id="navInventory" href="Main_Inv_Page.html">Inventory</a>
            <a id="navSuppliers" href="Supplier_Page.html">Suppliers</a>
            <a id="navStyles" href="Style_Page.html">Product Styles</a>
            <a id="navPayments" href="Payment_Term.html">Payment Terms</a>
            <a id="navOrders" href="Order_List.html">Orders</a>
        </div>

        <div class="nav-user">

            <span id="usernameLabel"></span>

            <button class="btn btn-logout" onclick="logout()">

                Logout

            </button>

        </div>

    </nav>

    <h1>Order Processing</h1>
    <p id="message"></p>

    <h2>Order Information</h2>

    <div class="details-grid">

        <div class="field-card">
            <label>Reference</label>
            <input type="text" id="reference" placeholder="Enter customer reference">
        </div>

        <div class="field-card">
            <label>Order Date</label>
            <input type="date" id="order_date">
        </div>

        <div class="field-card">
            <label>Misc Cost</label>

            <div class="currency-input">
                <span>$</span>
                <input type="number" step="0.01" id="misc_price">
            </div>
        </div>

    </div>



    <div id="materialsContainer"></div>
    <script src="auth.js"></script>
    <script type="module">

        checkAccess(["inventory"]);
        import { createClient }
            from "ID1";

        const supabase = createClient(
            "ID2",
            "ID3"
        );
        const SCHEMA = 'inventory_system';
        const urlMatId =
            new URLSearchParams(window.location.search).get("mat_id");
        let materials = [];
        let materialRowCounter = 0;

        function addMaterialRow(prefillMatId = null, prefillQuantity = "", prefillPrice = "") {

            materialRowCounter++;

            const id = materialRowCounter;

            const row = document.createElement("div");

            row.className = "order-item-card";

            row.innerHTML = `

            <button
                type="button"
                class="remove-material-btn">
                ✕ Remove
            </button>

            <div class="details-grid">

                <div class="field-card">
                    <label>Material</label>
                    <select id="material-${id}">
                        <option value="">Select Material...</option>
                    </select>
                </div>

                <div class="field-card">
                    <label>Quantity</label>

                    <input
                        type="number"
                        id="quantity-${id}"
                        min="1">

                    <small id="hint-${id}"></small>
                </div>

                <div class="field-card">
                    <label>Selling Price</label>

                    <div class="currency-input">
                        <span>$</span>

                        <input
                            type="number"
                            step="0.01"
                            id="price-${id}">
                    </div>
                </div>

            </div>

        `;

            document
                .getElementById("materialsContainer")
                .appendChild(row);

            const select = row.querySelector("select");

            materials.forEach(mat => {

                const option = document.createElement("option");

                option.value = mat.mat_id;

                option.textContent =
                    `${mat.mat_id} | ` +
                    `${mat.style_table?.style_name ?? ""} | ` +
                    `${mat.style_table?.material_name ?? ""} | ` +
                    `${mat.description ?? ""}`;

                select.appendChild(option);

            });

            const ts = new TomSelect(select, {
                create: false,
                maxItems: 1
            });

            ts.on("change", value => {

                const mat = materials.find(
                    x => String(x.mat_id) === String(value)
                );

                if (!mat) return;

                document.getElementById(
                    `hint-${id}`
                ).textContent =
                    `Available: ${mat.available_quantity}`;

                document.getElementById(
                    `quantity-${id}`
                ).max =
                    mat.available_quantity;

            });

            if (prefillMatId) {
                ts.setValue(prefillMatId);
            }

            document.getElementById(`quantity-${id}`).value = prefillQuantity;
            document.getElementById(`price-${id}`).value = prefillPrice;

            row
                .querySelector(".remove-material-btn")
                .onclick = () => row.remove();

        }

        async function loadMaterials() {

            const { data, error } = await supabase
                .schema(SCHEMA)
                .from("main_inv")
                .select(`
                    mat_id,
                    description,
                    available_quantity,
                    style_id,
                    style_table!main_inv_style_id_fkey (
                        style_name,
                        material_name
                        )
                    `)

                .order("mat_id");
            if (error) {
                alert(error.message);
                return;
            }

            materials = data || [];

            addMaterialRow(urlMatId);

        }


        async function loadExistingOrder() {

            const orderId =
                new URLSearchParams(window.location.search)
                    .get("order_id");

            if (!orderId)
                return;

            // Load order header
            const {
                data: order,
                error: orderError
            } = await supabase
                .schema(SCHEMA)
                .from("order_table")
                .select("*")
                .eq("order_id", orderId)
                .single();

            if (orderError) {
                alert(orderError.message);
                return;
            }
            document.getElementById("createOrderBtn").textContent = "Save Changes";

            document.getElementById("reference").value =
                order.reference ?? "";

            document.getElementById("order_date").value =
                order.order_date ?? "";

            document.getElementById("misc_price").value =
                order.misc_price ?? "";

            // Remove the default empty row
            document.getElementById("materialsContainer").innerHTML = "";
            materialRowCounter = 0;

            // Load line items
            const {
                data: items,
                error: itemError
            } = await supabase
                .schema(SCHEMA)
                .from("order_item")
                .select("*")
                .eq("order_id", orderId);

            if (itemError) {
                alert(itemError.message);
                return;
            }

            items.forEach(item => {

                addMaterialRow(
                    item.mat_id,
                    item.quantity,
                    item.selling_price
                );

            });

        }


        document.getElementById("createOrderBtn").onclick = async () => {

            try {

                const existingOrderId =
                    new URLSearchParams(window.location.search)
                        .get("order_id");

                const miscPrice =
                    Number(document.getElementById("misc_price").value) || 0;

                const items = [];

                const rows =
                    document.querySelectorAll(".order-item-card");

                // Build item list
                for (const row of rows) {

                    const ts = row.querySelector("select").tomselect;

                    const matId = Number(ts.getValue());

                    const quantity = Number(
                        row.querySelector('input[id^="quantity-"]').value
                    );

                    const sellingPrice = Number(
                        row.querySelector('input[id^="price-"]').value
                    );

                    const mat = materials.find(
                        x => x.mat_id === matId
                    );

                    if (!mat) {
                        alert("Please select a material.");
                        return;
                    }

                    if (quantity > mat.available_quantity) {
                        alert(
                            `Material ${matId}: requested quantity exceeds available quantity.`
                        );
                        return;
                    }

                    items.push({
                        mat_id: matId,
                        quantity: quantity,
                        selling_price: sellingPrice
                    });

                }

                // Calculate total selling price
                const totalSellingPrice =
                    items.reduce(
                        (sum, item) =>
                            sum + (item.selling_price),
                        0
                    ) + miscPrice;

                let order;

                if (existingOrderId) {

                    // Update order header
                    const { data, error } = await supabase
                        .schema(SCHEMA)
                        .from("order_table")
                        .update({
                            reference: document.getElementById("reference").value,
                            order_date: document.getElementById("order_date").value || null,
                            misc_price: miscPrice,
                            selling_price: totalSellingPrice
                        })
                        .eq("order_id", existingOrderId)
                        .select()
                        .single();

                    if (error) {
                        alert(error.message);
                        return;
                    }

                    order = data;

                    // Fetch previous order items
                    const {
                        data: oldItems,
                        error: oldItemsError
                    } = await supabase
                        .schema(SCHEMA)
                        .from("order_item")
                        .select("mat_id, quantity")
                        .eq("order_id", existingOrderId);

                    if (oldItemsError) {
                        alert(oldItemsError.message);
                        return;
                    }

                    // Restore inventory quantities
                    for (const oldItem of oldItems) {

                        const {
                            data: inv,
                            error: invError
                        } = await supabase
                            .schema(SCHEMA)
                            .from("main_inv")
                            .select("available_quantity")
                            .eq("mat_id", oldItem.mat_id)
                            .single();

                        if (invError) {
                            alert(invError.message);
                            return;
                        }

                        const { error: updateError } = await supabase
                            .schema(SCHEMA)
                            .from("main_inv")
                            .update({
                                available_quantity:
                                    inv.available_quantity + oldItem.quantity
                            })
                            .eq("mat_id", oldItem.mat_id);

                        if (updateError) {
                            alert(updateError.message);
                            return;
                        }
                    }

                    // Delete previous line items
                    const { error: deleteError } = await supabase
                        .schema(SCHEMA)
                        .from("order_item")
                        .delete()
                        .eq("order_id", existingOrderId);

                    if (deleteError) {
                        alert(deleteError.message);
                        return;
                    }

                }
                else {

                    const { data, error } = await supabase
                        .schema(SCHEMA)
                        .from("order_table")
                        .insert({
                            reference: document.getElementById("reference").value,
                            order_date: document.getElementById("order_date").value || null,
                            misc_price: miscPrice,
                            selling_price: totalSellingPrice
                        })
                        .select()
                        .single();

                    if (error) {
                        alert(error.message);
                        return;
                    }

                    order = data;

                }

                // Attach order_id to each line item
                items.forEach(item => {
                    item.order_id = order.order_id;
                });

                // Insert line items
                const { error: itemError } = await supabase
                    .schema(SCHEMA)
                    .from("order_item")
                    .insert(items);

                if (itemError) {
                    alert(itemError.message);
                    return;
                }

                for (const item of items) {

                    // Fetch current quantity and timeline
                    const { data: inv, error: invError } = await supabase
                        .schema(SCHEMA)
                        .from("main_inv")
                        .select("available_quantity, timeline_array")
                        .eq("mat_id", item.mat_id)
                        .single();

                    if (invError) {
                        alert(invError.message);
                        return;
                    }

                    // Get existing timeline or initialize an empty array
                    const timelineArray = inv.timeline_array || [];

                    // Append new timeline entry
                    timelineArray.push({
                        type: "order",
                        text: "Order placed",
                        order_id: order.order_id,
                        quantity: item.quantity,
                        timestamp: new Date().toISOString()
                    });

                    // Update inventory
                    const { error: updateError } = await supabase
                        .schema(SCHEMA)
                        .from("main_inv")
                        .update({
                            available_quantity: inv.available_quantity - item.quantity,
                            timeline_array: timelineArray
                        })
                        .eq("mat_id", item.mat_id);

                    if (updateError) {
                        alert(updateError.message);
                        return;
                    }
                }

                alert(
                    existingOrderId
                        ? "Order updated successfully."
                        : "Order created successfully."
                );

                window.location.reload();

            }
            catch (err) {

                console.error(err);
                alert(err.message);

            }

        };


        document
            .getElementById("addMaterialBtn")
            .onclick = () => {
                addMaterialRow();
            };

        await loadMaterials();
        await loadExistingOrder();

        const page = window.location.pathname.split("/").pop();


        const map = {
            "Main_Inv_Page.html": "navInventory",
            "Supplier_Page.html": "navSuppliers",
            "Style_Page.html": "navStyles",
            "Payment_Term.html": "navPayments",
            "Order_List.html": "navOrders",
            "Order_Page.html": "navOrders"
        };

        const activeId = map[page];

        if (activeId) {
            document.getElementById(activeId)?.classList.add("active");
        }

        showLoggedInUser();
    </script>

    <div class="button-row">

        <button type="button" id="addMaterialBtn" class="btn btn-secondary">
            + Add Material
        </button>

        <button id="createOrderBtn" class="btn btn-primary">
            Save Order
        </button>

        <button class="btn btn-secondary" onclick="window.location.href='Order_List.html'">
            Back to Orders
        </button>

        <button class="btn btn-secondary" onclick="window.location.href='Main_Inv_Page.html'">
            Back to Inventory
        </button>

    </div>
</body>

</html>
